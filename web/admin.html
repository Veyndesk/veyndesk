<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veyndesk Admin</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1f2630; --border:#2d3540; --text:#e6edf3; --muted:#8b949e;
    --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); display: grid; place-items: center; font-weight: 800; }
  nav { display: flex; gap: 6px; margin-left: 12px; }
  nav button, .tb { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  nav button.on { border-color: var(--accent); background: #172554; }
  .tb.danger { background: #3a1518; border-color: #5c1f24; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 12px; }
  input[type=search], input[type=password], input.note { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit; }
  .wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #4b5563; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
  .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .muted { color: var(--muted); }
  a { color: #93c5fd; }
  #login { max-width: 380px; margin: 80px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  #login input { width: 100%; margin: 12px 0; }
  .ev-auth_failed, .ev-session_kicked { color: var(--bad); }
  .ev-session_start { color: var(--ok); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="logo">V</div><h1>Veyndesk Admin</h1>
  <nav id="tabs" class="hidden">
    <button data-tab="devices" class="on" data-i18n="tabs.devices">Devices</button>
    <button data-tab="sessions" data-i18n="tabs.sessions">Sessions</button>
    <button data-tab="audit" data-i18n="tabs.audit">Audit log</button>
  </nav>
  <span style="margin-left:auto" class="muted" id="updated"></span>
  <select class="tb hidden" id="langSel" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option></select>
  <button class="tb hidden" id="logout" data-i18n="admin.signout">Sign out</button>
</header>

<div id="login">
  <strong data-i18n="login.title">Admin token</strong>
  <p class="muted" data-i18n-html="login.desc">Printed by the server on startup, or stored in <code>data/admin_token</code>.</p>
  <input type="password" id="token" data-i18n-ph="login.ph" placeholder="Paste admin token">
  <button class="tb" id="signin" data-i18n="login.signin">Sign in</button>
  <p id="lerr" style="color:var(--bad)"></p>
</div>

<main id="app" class="hidden">
  <div class="kpis">
    <div class="kpi"><b id="kOnline">0</b><span data-i18n="kpi.online">Devices online</span></div>
    <div class="kpi"><b id="kTotal">0</b><span data-i18n="kpi.total">Devices known</span></div>
    <div class="kpi"><b id="kSessions">0</b><span data-i18n="kpi.sessions">Active sessions</span></div>
    <div class="kpi"><b id="kFailed">0</b><span data-i18n="kpi.failed">Failed logins (24h)</span></div>
  </div>

  <section data-panel="devices">
    <div class="toolbar"><input type="search" id="q" data-i18n-ph="ph.search" placeholder="Search ID, name, note…"></div>
    <div class="wrap"><table>
      <thead><tr><th></th><th>ID</th><th data-i18n="th.name">Name</th><th>OS</th><th data-i18n="th.last_seen">Last seen</th><th>IP</th><th data-i18n="th.note">Note</th><th></th></tr></thead>
      <tbody id="devices"></tbody>
    </table></div>
  </section>

  <section data-panel="sessions" class="hidden">
    <div class="wrap"><table>
      <thead><tr><th data-i18n="th.session">Session</th><th data-i18n="th.device">Device</th><th data-i18n="th.viewer_ip">Viewer IP</th><th data-i18n="th.state">State</th><th data-i18n="th.started">Started</th><th></th></tr></thead>
      <tbody id="sessions"></tbody>
    </table></div>
  </section>

  <section data-panel="audit" class="hidden">
    <div class="wrap"><table>
      <thead><tr><th data-i18n="th.time">Time</th><th data-i18n="th.event">Event</th><th data-i18n="th.device">Device</th><th data-i18n="th.session">Session</th><th>IP</th><th data-i18n="th.detail">Detail</th></tr></thead>
      <tbody id="audit"></tbody>
    </table></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------------------------------------------------------- i18n (tiny, dependency-free)
// Static HTML uses data-i18n / data-i18n-ph / data-i18n-html attributes; dynamic strings call
// t("key", {params}). Language: localStorage override, else navigator.language, else en.
const I18N = {
  en: {
    "tabs.devices": "Devices",
    "tabs.sessions": "Sessions",
    "tabs.audit": "Audit log",
    "admin.signout": "Sign out",
    "login.title": "Admin token",
    "login.desc": "Printed by the server on startup, or stored in <code>data/admin_token</code>.",
    "login.ph": "Paste admin token",
    "login.signin": "Sign in",
    "kpi.online": "Devices online",
    "kpi.total": "Devices known",
    "kpi.sessions": "Active sessions",
    "kpi.failed": "Failed logins (24h)",
    "ph.search": "Search ID, name, note…",
    "th.name": "Name",
    "th.last_seen": "Last seen",
    "th.note": "Note",
    "th.session": "Session",
    "th.device": "Device",
    "th.viewer_ip": "Viewer IP",
    "th.state": "State",
    "th.started": "Started",
    "th.time": "Time",
    "th.event": "Event",
    "th.detail": "Detail",
    "ago.now": "now",
    "ago.min": "{n} min ago",
    "ago.hour": "{n} h ago",
    "ago.day": "{n} d ago",
    "state.online": "online",
    "state.offline": "offline",
    "ph.note": "Add note…",
    "admin.connect": "Connect",
    "admin.no_devices": "No devices yet. Run the host agent with --server pointing here.",
    "admin.active": "active",
    "admin.authenticating": "authenticating",
    "admin.disconnect": "Disconnect",
    "admin.no_sessions": "No sessions right now.",
    "admin.updated": "Updated {time}",
    "admin.update_failed": "Update failed",
    "admin.invalid_token": "Invalid token",
  },
  tr: {
    "tabs.devices": "Cihazlar",
    "tabs.sessions": "Oturumlar",
    "tabs.audit": "Denetim kaydı",
    "admin.signout": "Oturumu kapat",
    "login.title": "Yönetici anahtarı",
    "login.desc": "Sunucu tarafından ilk açılışta yazdırılır veya <code>data/admin_token</code> dosyasında saklanır.",
    "login.ph": "Yönetici anahtarını yapıştırın",
    "login.signin": "Oturum aç",
    "kpi.online": "Çevrimiçi cihaz",
    "kpi.total": "Bilinen cihaz",
    "kpi.sessions": "Etkin oturum",
    "kpi.failed": "Hatalı giriş (24 sa)",
    "ph.search": "ID, ad, not ara…",
    "th.name": "Ad",
    "th.last_seen": "Son görülme",
    "th.note": "Not",
    "th.session": "Oturum",
    "th.device": "Cihaz",
    "th.viewer_ip": "İzleyici IP",
    "th.state": "Durum",
    "th.started": "Başlangıç",
    "th.time": "Zaman",
    "th.event": "Olay",
    "th.detail": "Ayrıntı",
    "ago.now": "şimdi",
    "ago.min": "{n} dk önce",
    "ago.hour": "{n} sa önce",
    "ago.day": "{n} g önce",
    "state.online": "çevrimiçi",
    "state.offline": "çevrimdışı",
    "ph.note": "Not ekle…",
    "admin.connect": "Bağlan",
    "admin.no_devices": "Henüz cihaz yok. Host aracını --server seçeneğiyle bu sunucuyu gösterecek şekilde çalıştırın.",
    "admin.active": "etkin",
    "admin.authenticating": "kimlik doğrulanıyor",
    "admin.disconnect": "Bağlantıyı kes",
    "admin.no_sessions": "Şu anda oturum yok.",
    "admin.updated": "Güncellendi: {time}",
    "admin.update_failed": "Güncelleme başarısız",
    "admin.invalid_token": "Geçersiz anahtar",
  },
};
const i18n = (() => {
  let lang = null;
  try { lang = localStorage.getItem("veyndesk.lang"); } catch {}
  if (!lang || !I18N[lang]) lang = (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";
  const t = (key, params) => {
    let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
    if (params) for (const [k, v] of Object.entries(params)) s = s.replaceAll("{" + k + "}", String(v));
    return s;
  };
  const apply = () => {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  };
  const setLang = (l) => { if (!I18N[l]) return; lang = l; try { localStorage.setItem("veyndesk.lang", l); } catch {} apply(); refresh(); };
  apply();
  return { t, apply, setLang, get lang() { return lang; } };
})();

const fmtId = (id) => id.replace(/(\d{3})(?=\d)/g, "$1 ");
const ago = (ts) => {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return i18n.t("ago.now"); if (s < 3600) return i18n.t("ago.min", { n: Math.floor(s / 60) });
  if (s < 86400) return i18n.t("ago.hour", { n: Math.floor(s / 3600) }); return i18n.t("ago.day", { n: Math.floor(s / 86400) });
};
const time = (ts) => new Date(ts * 1000).toLocaleString();
let token = ""; try { token = sessionStorage.getItem("vd.token") || ""; } catch {}
let tab = "devices", hosts = [];

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + token, "Content-Type": "application/json" } });
  if (r.status === 401) { signOut(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error(r.statusText);
  return r.status === 204 ? null : r.json();
}

function signOut() {
  token = ""; try { sessionStorage.removeItem("vd.token"); } catch {}
  $("app").classList.add("hidden"); $("tabs").classList.add("hidden"); $("logout").classList.add("hidden");
  $("login").classList.remove("hidden");
}
async function signIn() {
  token = $("token").value.trim();
  try { await api("/api/hosts"); } catch { $("lerr").textContent = i18n.t("admin.invalid_token"); return; }
  try { sessionStorage.setItem("vd.token", token); } catch {}
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("tabs").classList.remove("hidden"); $("logout").classList.remove("hidden");
  refresh();
}
$("signin").onclick = signIn;
$("token").onkeydown = (e) => { if (e.key === "Enter") signIn(); };
$("logout").onclick = signOut;

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("[data-panel]").forEach(p => p.classList.toggle("hidden", p.dataset.panel !== tab));
  refresh();
});

function renderHosts() {
  const q = $("q").value.toLowerCase();
  $("devices").innerHTML = hosts
    .filter(h => !q || [h.id, h.name, h.note, h.os].join(" ").toLowerCase().includes(q))
    .map(h => `<tr>
      <td><span class="dot ${h.online ? "on" : ""}" title="${h.online ? i18n.t("state.online") : i18n.t("state.offline")}"></span>${h.sessions ? `<span class="muted">${h.sessions}▸</span>` : ""}</td>
      <td class="mono">${esc(fmtId(h.id))}</td><td>${esc(h.name)}</td><td class="muted">${esc(h.os)} · v${esc(h.version)}</td>
      <td>${h.online ? i18n.t("state.online") : esc(ago(h.last_seen))}</td><td class="mono muted">${esc(h.last_ip)}</td>
      <td><input class="note" data-id="${esc(h.id)}" value="${esc(h.note)}" placeholder="${i18n.t("ph.note")}"></td>
      <td>${h.online ? `<a href="/?id=${encodeURIComponent(h.id)}" target="_blank">${i18n.t("admin.connect")}</a>` : ""}</td></tr>`).join("")
    || `<tr><td colspan="8" class="muted">${i18n.t("admin.no_devices")}</td></tr>`;
  document.querySelectorAll("input.note").forEach(i => i.onchange = () =>
    api(`/api/hosts/${encodeURIComponent(i.dataset.id)}/note`, { method: "POST", body: JSON.stringify({ note: i.value }) }));
}
$("q").oninput = renderHosts;

async function refresh() {
  if (!token) return;
  if (document.activeElement && document.activeElement.classList.contains("note")) return; // don't clobber edits
  try {
    const [h, s, a] = await Promise.all([api("/api/hosts"), api("/api/sessions"), api("/api/audit?limit=500")]);
    hosts = h; renderHosts();
    $("kOnline").textContent = h.filter(x => x.online).length; $("kTotal").textContent = h.length;
    const active = s.filter(x => x.active); $("kSessions").textContent = active.length;
    $("kFailed").textContent = a.filter(x => x.event === "auth_failed" && x.ts > Date.now() / 1000 - 86400).length;
    $("sessions").innerHTML = s.map(x => `<tr><td class="mono">#${x.sid}</td><td class="mono">${esc(fmtId(x.host_id))}</td>
      <td class="mono">${esc(x.viewer_ip)}</td><td>${x.active ? i18n.t("admin.active") : i18n.t("admin.authenticating")}</td><td>${esc(time(x.started))}</td>
      <td><button class="tb danger" data-kick="${x.sid}">${i18n.t("admin.disconnect")}</button></td></tr>`).join("")
      || `<tr><td colspan="6" class="muted">${i18n.t("admin.no_sessions")}</td></tr>`;
    document.querySelectorAll("[data-kick]").forEach(b => b.onclick = async () => { await api(`/api/sessions/${b.dataset.kick}/kick`, { method: "POST" }); refresh(); });
    $("audit").innerHTML = a.map(x => `<tr><td>${esc(time(x.ts))}</td><td class="ev-${esc(x.event)}">${esc(x.event.replace(/_/g, " "))}</td>
      <td class="mono">${esc(x.host_id ? fmtId(x.host_id) : "")}</td><td class="mono">${x.sid ?? ""}</td><td class="mono muted">${esc(x.ip)}</td>
      <td class="muted">${esc(x.detail)}</td></tr>`).join("");
    $("updated").textContent = i18n.t("admin.updated", { time: new Date().toLocaleTimeString() });
  } catch (e) { $("updated").textContent = i18n.t("admin.update_failed"); }
}
setInterval(refresh, 5000);
if (token) { $("token").value = token; signIn(); }

$("langSel").value = i18n.lang;
$("langSel").onchange = () => i18n.setLang($("langSel").value);
</script>
</body>
</html>
